        <h1>driftwave — Claude, but it looks before it codes</h1>
        <p>A Claude Code plugin. Before it changes anything, driftwave checks what's there, what you asked for, and the gap — then does the work, logs it, and verifies it.</p>
        <p><strong>Install:</strong> <code>claude plugin marketplace add RogueGringo/driftwave</code>, then <code>claude plugin install driftwave@driftwave</code></p>
        <p>The two commands you need to start: <code>/driftwave:directive</code> and <code>/driftwave:status</code>. Source &amp; docs: <a href="https://github.com/RogueGringo/driftwave">github.com/RogueGringo/driftwave</a></p>
